<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Email Generator</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,.10);
        }

        h1 { margin-top: 0; text-align: center; }
        .subtitle { text-align: center; color: #6b7280; }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background: #4338ca; }
        button:disabled { opacity: .6; cursor: wait; }

        #result {
            display: none;
            margin-top: 24px;
            padding: 18px;
            border-radius: 10px;
            background: #eef2ff;
            overflow-wrap: anywhere;
        }

        #message { margin-top: 16px; color: #b91c1c; }
        .result-row { margin: 10px 0; }
    </style>
</head>

<body>
<div class="container">
    <h1>Email Generator</h1>
    <p class="subtitle">Generate employee email details</p>

    <form id="employeeForm">
        <label for="firstname">First Name</label>
        <input id="firstname" name="firstname"
               maxlength="50" required placeholder="Enter first name">

        <label for="lastname">Last Name</label>
        <input id="lastname" name="lastname"
               maxlength="50" required placeholder="Enter last name">

        <label for="department">Department</label>
        <select id="department" name="department" required>
            <option value="">Select department</option>
            <option value="C++">C++</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
            <option value="None">None</option>
        </select>

        <button id="submitButton" type="submit">Generate Email</button>
    </form>

    <p id="message" role="alert"></p>

    <section id="result" aria-live="polite">
        <h2>Generated Employee Details</h2>
        <div class="result-row"><strong>Display Name:</strong> <span id="displayName"></span></div>
        <div class="result-row"><strong>Company Email:</strong> <span id="companyEmail"></span></div>
        <div class="result-row"><strong>Password:</strong> <span id="password"></span></div>
        <div class="result-row"><strong>Mailbox Capacity:</strong> <span id="mailboxCapacity"></span></div>
    </section>
</div>

<script>
    const form = document.getElementById("employeeForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        message.textContent = "";
        result.style.display = "none";
        button.disabled = true;
        button.textContent = "Generating...";

        const employee = {
            firstname: document.getElementById("firstname").value.trim(),
            lastname: document.getElementById("lastname").value.trim(),
            department: document.getElementById("department").value
        };

        try {
            const response = await fetch("/api/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(employee)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Unable to generate employee details.");
            }

            document.getElementById("displayName").textContent = data.displayName;
            document.getElementById("companyEmail").textContent = data.companyEmail;
            document.getElementById("password").textContent = data.password;
            document.getElementById("mailboxCapacity").textContent = data.mailboxCapacity;

            result.style.display = "block";

        } catch (error) {
            message.textContent = error.message;
        } finally {
            button.disabled = false;
            button.textContent = "Generate Email";
        }
    });
</script>
</body>
</html>
